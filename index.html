<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Auth Starter — пример регистрации и входа." />
    <title>Auth Starter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">auth-starter</a>
      <span class="project-note">Node.js · email and password</span>
    </header>

    <main class="main">
      <section class="auth-card" aria-labelledby="form-title">
        <div id="auth-view">
          <div class="card-topline">
            <span class="card-label">AUTH STARTER</span>
            <span class="card-step" id="step-label">01 / 02</span>
          </div>
          <h1 id="form-title">Войти</h1>
          <p class="card-subtitle" id="form-subtitle">Войди, используя почту и пароль.</p>

          <form id="auth-form" novalidate>
            <label class="field" id="name-field" hidden>
              <span>Имя</span>
              <input type="text" name="name" autocomplete="name" placeholder="Александр" minlength="2" maxlength="60" />
            </label>
            <label class="field">
              <span>Электронная почта</span>
              <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required maxlength="254" />
            </label>
            <label class="field">
              <span>Пароль</span>
              <div class="password-wrap">
                <input type="password" name="password" autocomplete="current-password" placeholder="Не менее 8 символов" required minlength="8" maxlength="128" />
                <button type="button" class="password-toggle" aria-label="Показать пароль">Показать</button>
              </div>
            </label>
            <button class="submit-button" type="submit"><span id="submit-label">Войти</span></button>
          </form>

          <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
          <p class="switch-copy" id="switch-copy">Нет аккаунта? <button type="button" id="switch-mode">Зарегистрироваться</button></p>
        </div>

        <div class="signed-in" id="signed-in" hidden>
          <div class="card-topline"><span class="card-label">AUTH STARTER</span></div>
          <h1>Аккаунт</h1>
          <p class="card-subtitle" id="welcome-copy">Вы вошли.</p>
          <div class="account-chip">
            <span class="account-avatar" id="account-avatar">A</span>
            <span class="account-details"><strong id="account-name"></strong><small id="account-email"></small></span>
            <span class="account-provider" id="account-provider"></span>
          </div>
          <button class="submit-button logout-button" id="logout-button">Выйти</button>
        </div>
      </section>
    </main>

    <footer class="footer">Почта и пароль</footer>
  </body>
</html>
